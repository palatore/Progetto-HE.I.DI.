<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Benvenuto {{ name }}
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Tab 1</ion-title>
    </ion-toolbar>
  </ion-header>
  <ion-grid>
    <ion-row>
      <ion-col size-md="3">
        <ion-card style="padding:20px 20px 500px 20px">
          La tua giornata
        </ion-card>
      </ion-col>
      <ion-col size-md="9">
        <ion-grid>
          <ion-row>
            <ion-card style="padding:20px">
              prova
            </ion-card>
          </ion-row>
          <ion-row>
            <ion-card style="padding:20px">
              esilom
            </ion-card>
          </ion-row>
        </ion-grid>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
