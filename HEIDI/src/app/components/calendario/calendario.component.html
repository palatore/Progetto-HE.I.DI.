<full-calendar [options]="calendarOptions"></full-calendar>

<ion-modal
[isOpen] = "isShow"
(didDismiss) = "isShow = false"
[breakpoints]="[0, 0.5, 0.8]"
[initialBreakpoint]="0.5">

    <ng-template>
        <ion-header>
            <ion-toolbar>
                <ion-title>Impegni del {{data_selezionata}}</ion-title>
                <ion-button (click)="isShow = false" slot="end"><ion-icon name="close"></ion-icon></ion-button>
            </ion-toolbar>
        </ion-header>

        <ion-content class="ion-padding">
            
        </ion-content>
    </ng-template>

</ion-modal>
