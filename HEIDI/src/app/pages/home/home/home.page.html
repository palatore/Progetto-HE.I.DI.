<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Home</ion-title>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-button slot="end" (click)="logout()"><ion-icon name="log-out-outline"></ion-icon></ion-button>
  </ion-toolbar>
</ion-header>


<ng-container *ngIf="(ruoloUtente | async) as ruolo">

  <!--Homepage per il ruolo utente-->
  @if(ruolo === '0') {
    <ng-container>

      <ion-content [fullscreen]="true">

        <ion-card class="laTuaGiornata">
          <ion-card-content class="calendario">
            <app-calendario></app-calendario>
          </ion-card-content>
          
        </ion-card>

        <ion-button [routerLink]="['/creazionePasto']">Crea Pasto</ion-button>
        <ion-button [routerLink]="['/pastiUtente']">I miei Pasti</ion-button>
        <ion-button [routerLink]="['/creazioneAllenamento']">Crea Allenamento</ion-button>
        <ion-button [routerLink]="['/allenamentiUtente']">I miei allenamenti</ion-button>
        <ion-button [routerLink]="['/gestioneProfessionisti']">Professionisti</ion-button>
        <ion-button [routerLink]="['/profilo']">Profilo</ion-button>
      </ion-content>
    </ng-container>

  } @else {
    <!--Homepage per il ruolo professionista-->
    <ng-container>
        <ion-content [fullscreen]="true">
          <ion-card class="iTuoiPazienti">
            I tuoi Pazienti
            <ion-card-content class="pasti">
            </ion-card-content>
          </ion-card>
        
          <ion-button [routerLink]="['/gestioneRichieste']">Le mie Richieste</ion-button>
          <ion-button [routerLink]="['/pazientiDietologo']">I miei Pazienti</ion-button>
        </ion-content>
    </ng-container>
  }

</ng-container>
