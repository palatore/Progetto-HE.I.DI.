<ion-app>

  <ion-menu side="start" contentId="main-content" type="overlay">
    <ion-header>
      <ion-toolbar>
        <ion-title>Menu</ion-title>
      </ion-toolbar>
    </ion-header>
    <ion-content class ="sidebar">

      @if (ruolo$ | async; as ruolo) {

        <ion-list>
          <ion-menu-toggle>
            <ion-item>
              <ion-label button [routerLink]='["/home"]'>Home</ion-label>
              <ion-icon name="home-outline"></ion-icon>
            </ion-item>
            <ion-item>
              <ion-label button [routerLink]='["/profilo"]'>Profilo</ion-label>
              <ion-icon name="person-outline"></ion-icon>
            </ion-item>

            @if(ruolo === '0') {
              <ion-item>
                <ion-label button [routerLink]='["/calendario"]'>Calendario</ion-label>
                <ion-icon name="calendar-outline"></ion-icon>
              </ion-item>
              <ion-item>
                <ion-label button [routerLink]='["/richieste"]'>Professionisti</ion-label>
                <ion-icon name="people-outline"></ion-icon>
              </ion-item>
            } @else {
              <ion-item>
                <ion-label button [routerLink]='["/richieste"]'>Associazioni</ion-label>
                <ion-icon name="people-outline"></ion-icon>
              </ion-item>
            }
            <ion-item>
              <ion-label button (click)="onLogout()">Logout</ion-label>
              <ion-icon name="log-out-outline"></ion-icon>
            </ion-item>
          </ion-menu-toggle>
      </ion-list>
      }
    </ion-content>
  </ion-menu>
  <ion-router-outlet id="main-content"></ion-router-outlet>
</ion-app>
